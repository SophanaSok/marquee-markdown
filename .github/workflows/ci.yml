name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # The library is meant to be used, so its documentation has to build
      # clean — including the intra-doc links.
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    # Every OS: terminal handling, path resolution and the file watcher all
    # differ per platform, and `ctrl+z` exists on only one of them.
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo test --all-targets
      # `--all-targets` silently skips doctests, and the render module's
      # public example is one.
      - run: cargo test --doc

  smoke:
    # Several bugs in this project were invisible to the whole test suite and
    # obvious within seconds of running the binary. This is that check, for
    # the ones that can be made without a terminal.
    name: Smoke test the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and exercise the binary
        shell: bash
        run: |
          # `-x` so a failure names the command that failed: a smoke job that
          # only says "exit 1" makes you push again to find out where.
          set -euxo pipefail
          # `--locked`, so this exercises the dependency versions the
          # repository actually pins rather than whatever resolves today.
          cargo build --release --locked
          BIN=target/release/marquee-markdown
          # Every file this script writes goes to a scratch directory, never
          # the checkout. Its outputs were once committed by a broad `git add`
          # and shipped in the tag; a script that cannot litter beats one that
          # relies on everyone remembering not to.
          OUT=$(mktemp -d)
          "$BIN" --version

          # The short alias is the same program, and names itself correctly:
          # completions registered for the wrong name never fire.
          target/release/mmd --version
          # Written to a file rather than piped into `grep -q`: under
          # `pipefail`, grep exits at the first match, the writer upstream dies
          # of SIGPIPE, and the pipeline fails a test that actually passed.
          #
          # Checked for the name rather than against an exact line: the script
          # is generated by clap_complete and its exact shape is not ours to
          # assert. What matters is that it is registered for `mmd`.
          target/release/mmd completion bash > "$OUT"/mmd.bash
          grep -q '_mmd' "$OUT"/mmd.bash
          ! grep -q '_marquee' "$OUT"/mmd.bash
          target/release/mmd man > "$OUT"/mmd.1
          grep -q 'TH mmd' "$OUT"/mmd.1
          test "$("$BIN" -w 60 README.md)" = "$(target/release/mmd -w 60 README.md)"

          # Rendering a file. The content check is the point: this ran with
          # standard input redirected, which used to make the named file be
          # ignored in favour of whatever was on stdin — rendering nothing
          # here, and passing a comparison of two empty strings.
          "$BIN" -w 60 README.md > "$OUT"/wide.txt
          head -5 "$OUT"/wide.txt
          grep -q marquee "$OUT"/wide.txt
          test "$(wc -l < "$OUT"/wide.txt)" -gt 20
          # Characters, not bytes: the invariant is a column count.
          test "$(head -1 "$OUT"/wide.txt | wc -m)" -eq 61

          # A named source wins over whatever standard input happens to be.
          "$BIN" -w 60 README.md < Cargo.toml > "$OUT"/named.txt
          grep -q marquee "$OUT"/named.txt
          ! grep -q 'edition' "$OUT"/named.txt

          # Piped standard input, which is still read when nothing is named
          # or when `-` asks for it. This path once read an empty document
          # because a non-interactive shell hands children /dev/null.
          cat README.md | "$BIN" -w 60 > "$OUT"/piped.txt
          grep -q marquee "$OUT"/piped.txt
          "$BIN" -w 60 - < README.md > "$OUT"/dash.txt
          grep -q marquee "$OUT"/dash.txt

          # A reader that closes the pipe is how a filter is told to stop,
          # not a crash.
          "$BIN" README.md | head -c 200 > /dev/null

          # Redirected output carries no escape sequences.
          "$BIN" README.md > "$OUT"/out.txt
          ! grep -q $'\x1b' "$OUT"/out.txt

          # Including the style that asks the terminal about its colors. The
          # question is a write of escape sequences, and a question asked down
          # a pipe is a question written into somebody's file. `auto` is an
          # alias that asks nothing, and is checked anyway because it is the
          # default: the day that stops being true is the day this has to
          # already have been here.
          MARQUEE_STYLE=system "$BIN" README.md > "$OUT"/system.txt
          ! grep -q $'\x1b' "$OUT"/system.txt
          MARQUEE_STYLE=auto "$BIN" README.md > "$OUT"/auto.txt
          ! grep -q $'\x1b' "$OUT"/auto.txt

          # `-n` keeps the author's line breaks; without it they are re-flowed.
          printf '# T\n\nalpha\nbeta\n' > "$OUT"/n.md
          "$BIN" -n -w 40 "$OUT"/n.md | grep -q '^alpha  *$'
          ! "$BIN" -w 40 "$OUT"/n.md | grep -q '^alpha  *$'

          # The generated surfaces still generate. Written to files first for
          # the same SIGPIPE reason.
          "$BIN" man > "$OUT"/man.1 && test -s "$OUT"/man.1
          "$BIN" completion bash > "$OUT"/completion.bash && test -s "$OUT"/completion.bash
          "$BIN" themes > "$OUT"/themes.txt && grep -q slate "$OUT"/themes.txt
          grep -q system "$OUT"/themes.txt
          "$BIN" keys > "$OUT"/keys.md && grep -q line-down "$OUT"/keys.md
          "$BIN" config > "$OUT"/config.toml && grep -q '\[general\]' "$OUT"/config.toml

          # The effective configuration round-trips as a configuration file.
          "$BIN" --config "$OUT"/config.toml config > /dev/null

          # A file in the usual place is read when nothing names one. This is
          # the only check that covers it: `Config::load` finds that location
          # through `dirs`, so no unit test can see the call, and a version of
          # it that found nothing would leave every reader's configuration
          # silently unread with all five hundred of them still passing.
          mkdir -p "$OUT/config/marquee-markdown"
          printf '[general]\nstyle = "paper"\nwidth = 42\n' \
              > "$OUT/config/marquee-markdown/config.toml"
          XDG_CONFIG_HOME="$OUT/config" "$BIN" config > "$OUT"/found.toml
          grep -q 'marquee-markdown/config.toml' "$OUT"/found.toml
          grep -q 'style = "paper"' "$OUT"/found.toml
          grep -q 'width = 42' "$OUT"/found.toml

          # The update check stays inert here: `CI` is set and standard error
          # is no terminal, so nothing is fetched and nothing is cached. The
          # cache directory not appearing is the proof that no thread ran.
          XDG_CACHE_HOME="$OUT/cache" "$BIN" -w 60 README.md > /dev/null 2> "$OUT"/quiet.txt
          ! grep -q 'is available' "$OUT"/quiet.txt
          test ! -e "$OUT/cache/marquee-markdown"
          # The explicit opt-out holds even where the other guards would not.
          XDG_CACHE_HOME="$OUT/cache" MARQUEE_UPDATE_CHECK=0 "$BIN" -w 60 README.md > /dev/null
          test ! -e "$OUT/cache/marquee-markdown"

  handoff:
    # The smoke job above covers what can be checked without a terminal. This
    # is the other half, and it exists because the bug it protects against was
    # invisible to five hundred passing tests: the reader thread went on
    # reading standard input while an editor owned the terminal, so the two
    # processes split the keystrokes between them and the editor lost words.
    # Reproducing it needs two processes and a real pty, which is what the
    # script builds.
    #
    # Linux only. Windows has no pty to hand over and no `$EDITOR` convention,
    # and macOS hung on this script rather than running it — the build
    # finished, the script started, and nothing happened until the job was
    # cancelled twenty minutes later. The unbounded waits that could explain
    # it have since been closed and the script now has a watchdog that names
    # the stage it died in, so the way back in is to put `macos-latest` here
    # and read what it says. Until somebody does that, this covers Linux
    # honestly rather than covering macOS in name.
    name: Terminal handoff
    runs-on: ubuntu-latest
    # The script has its own watchdog; this is the belt to that pair of braces.
    # A job that hangs holds a runner until the six-hour default gives up.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      # Debug rather than release: the script drives the binary through a
      # terminal, and the thing being timed is a handshake between threads,
      # not throughput.
      - run: python3 scripts/handoff-check.py target/debug/marquee-markdown

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Read from the manifest rather than repeating it, so the version
      # promised and the version tested cannot drift.
      - id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  package:
    name: Publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Catches what only publishing catches: a missing README, metadata that
      # will not validate, or a file excluded that turns out to be needed.
      - run: cargo package --allow-dirty
      # `cargo package` only *builds* what it packaged, so a test that reads a
      # file left out of the archive still compiles here and not for anyone who
      # downloads it. `docs/` was excluded once, with a test reading a file
      # from it; this is the check that would have caught it.
      - name: The packaged crate's own tests compile
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cd "target/package/marquee-markdown-$version"
          cargo test --no-run

  semver:
    # The stable API surface is a promise, and this is the machine holding it:
    # every push is compared against the latest published version. It could
    # not exist before 0.1.0 was on crates.io, because it needs a baseline.
    name: API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  audit:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
