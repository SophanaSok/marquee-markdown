name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; the one job that publishes the release asks for write
# itself. The build jobs run third-party actions, and those must not hold a
# token that could edit the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    # The gates that make a half-made release impossible. A tag that does not
    # match the manifest, or a changelog with nothing to say for the version,
    # stops everything before a single binary is built — both have produced
    # quiet drift before: an empty release body, and a Scoop manifest two
    # releases behind.
    name: The tag matches the crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag and Cargo.toml name the same version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag is $GITHUB_REF_NAME but Cargo.toml says $version" >&2
            exit 1
          fi
      - name: The changelog has notes for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## / { if (found) exit; if (index($0, ver)) found = 1; next }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no notes under a heading containing $version" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: x86_64-linux
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            name: aarch64-macos
            target: aarch64-apple-darwin
          # Cross-compiled on the Apple Silicon runner rather than built on an
          # Intel one: the macos-13 runners are being retired and can sit
          # queued for half an hour. Both toolchains ship with Xcode, so this
          # is a target flag rather than a different machine.
          - os: macos-latest
            name: x86_64-macos
            target: x86_64-apple-darwin
          - os: windows-latest
            name: x86_64-windows
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}

      # The binary generates its own man page and completions, so they cannot
      # drift from the flags it actually accepts.
      # Generated under both names: completions registered for a name the
      # reader does not type simply never fire.
      #
      # A cross-compiled binary cannot run on the machine that built it, but
      # its man page and completions are target-independent — so that one
      # archive generates them from a native build instead of shipping bare,
      # which is what it used to do.
      - name: Generate man pages and completions
        shell: bash
        run: |
          dir="target/${{ matrix.target }}/release"
          if [ "${{ matrix.name }}" = "x86_64-macos" ]; then
            cargo build --release --locked
            dir="target/release"
          fi
          mkdir -p dist/man dist/completions
          for name in marquee-markdown mmd; do
            bin="$dir/$name"
            [ -f "$bin.exe" ] && bin="$bin.exe"
            "$bin" man > "dist/man/$name.1"
            for shell in bash zsh fish powershell elvish; do
              "$bin" completion "$shell" > "dist/completions/$name.$shell"
            done
          done

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="marquee-markdown-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/marquee-markdown" "$name/"
          cp "target/${{ matrix.target }}/release/mmd" "$name/"
          cp README.md LICENSE CHANGELOG.md "$name/"
          cp -r dist/man dist/completions "$name/"
          tar czf "$name.tar.gz" "$name"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name="marquee-markdown-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/marquee-markdown.exe" "$name/"
          cp "target/${{ matrix.target }}/release/mmd.exe" "$name/"
          cp README.md LICENSE CHANGELOG.md "$name/"
          cp -r dist/man dist/completions "$name/"
          7z a "$name.zip" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            marquee-markdown-*.tar.gz
            marquee-markdown-*.zip

  linux-packages:
    name: Debian and RPM packages
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb cargo-generate-rpm --locked
      - run: cargo build --release --locked
      # The asset lists in `[package.metadata.deb]` and
      # `[package.metadata.generate-rpm]` point into `dist/`; Debian policy
      # counts a binary without a man page as a bug, so the packages carry
      # what the archives carry. `gzip -n` for reproducibility — without it
      # the archive embeds its own mtime.
      - name: Generate man pages and completions
        run: |
          mkdir -p dist/man dist/completions
          for name in marquee-markdown mmd; do
            bin="target/release/$name"
            "$bin" man > "dist/man/$name.1"
            for shell in bash zsh fish; do
              "$bin" completion "$shell" > "dist/completions/$name.$shell"
            done
          done
          gzip -9n dist/man/*.1
      - run: cargo deb --no-build
      - run: cargo generate-rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm

  publish-crate:
    # crates.io gets the crate from the same commit as everything else, over
    # OIDC (trusted publishing) rather than a stored token — publishing by
    # hand is the step that used to be forgettable. Runs after the builds so
    # a broken release never publishes, and before the GitHub release so a
    # release page never exists for a version crates.io does not have.
    name: Publish to crates.io
    needs: [preflight, build, linux-packages]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC, exchanged for a temporary crates.io token
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    name: Publish the release
    needs: [build, linux-packages, publish-crate]
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect and checksum
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} release/ \;
          cd release && sha256sum * > checksums.txt
      # Built here rather than kept in the repository, because the hash cannot
      # exist before the archive does — which is exactly how the checked-in
      # manifest came to sit two releases behind. Generated from the checksums
      # this run just wrote, so it cannot describe a different build.
      - name: Build the Scoop manifest from the checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="marquee-markdown-v$version-x86_64-windows.zip"
          hash=$(awk -v a="$archive" '$2 == a { print $1 }' release/checksums.txt)
          if [ "${#hash}" -ne 64 ]; then
            echo "no sha256 for $archive in checksums.txt" >&2
            exit 1
          fi
          sed -e "s/@VERSION@/$version/g" -e "s/@HASH@/$hash/g" \
            packaging/scoop/marquee-markdown.template.json > release/marquee-markdown.json
          python3 - "$version" "$hash" <<'CHECK'
          import json, sys
          version, hash_ = sys.argv[1], sys.argv[2]
          text = open("release/marquee-markdown.json").read()
          assert "@" not in text, "a placeholder was left unsubstituted"
          m = json.loads(text)
          arch = m["architecture"]["64bit"]
          assert m["version"] == version, m["version"]
          assert arch["hash"] == hash_, arch["hash"]
          for field in ("url", "extract_dir"):
              assert f"v{version}" in arch[field], arch[field]
          assert "$version" in m["autoupdate"]["architecture"]["64bit"]["url"]
          print(f"scoop manifest: {version} {hash_[:12]}...")
          CHECK

      - name: Take the notes from the changelog
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## / { if (found) exit; if (index($0, ver)) found = 1; next }
            found { print }
          ' CHANGELOG.md > notes.md
          # A random delimiter, so no changelog line can ever equal it and
          # truncate the output early.
          delim="NOTES_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          echo "body<<$delim" >> "$GITHUB_OUTPUT"
          cat notes.md >> "$GITHUB_OUTPUT"
          echo "$delim" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: release/*
