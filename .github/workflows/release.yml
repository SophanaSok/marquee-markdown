name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: x86_64-linux
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            name: aarch64-macos
            target: aarch64-apple-darwin
          # Cross-compiled on the Apple Silicon runner rather than built on an
          # Intel one: the macos-13 runners are being retired and can sit
          # queued for half an hour. Both toolchains ship with Xcode, so this
          # is a target flag rather than a different machine.
          - os: macos-latest
            name: x86_64-macos
            target: x86_64-apple-darwin
          - os: windows-latest
            name: x86_64-windows
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}

      # The binary generates its own man page and completions, so they cannot
      # drift from the flags it actually accepts.
      # Generated under both names: completions registered for a name the
      # reader does not type simply never fire.
      #
      # Skipped where the binary was cross-compiled, since it cannot be run on
      # the machine that built it. Those archives carry the binary alone; the
      # man page and completions can be produced by the installed program.
      - name: Generate man pages and completions
        if: matrix.name != 'x86_64-macos'
        shell: bash
        run: |
          dir="target/${{ matrix.target }}/release"
          mkdir -p dist/man dist/completions
          for name in marquee-markdown mmd; do
            bin="$dir/$name"
            [ -f "$bin.exe" ] && bin="$bin.exe"
            "$bin" man > "dist/man/$name.1"
            for shell in bash zsh fish powershell elvish; do
              "$bin" completion "$shell" > "dist/completions/$name.$shell"
            done
          done

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="marquee-markdown-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/marquee-markdown" "$name/"
          cp "target/${{ matrix.target }}/release/mmd" "$name/"
          cp README.md LICENSE CHANGELOG.md "$name/"
          # An `&&` list would be the last command in the script, and a false
          # test would fail the step under `bash -e`.
          if [ -d dist/man ]; then
            cp -r dist/man dist/completions "$name/"
          fi
          tar czf "$name.tar.gz" "$name"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name="marquee-markdown-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/marquee-markdown.exe" "$name/"
          cp "target/${{ matrix.target }}/release/mmd.exe" "$name/"
          cp README.md LICENSE CHANGELOG.md "$name/"
          cp -r dist/completions "$name/"
          7z a "$name.zip" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            marquee-markdown-*.tar.gz
            marquee-markdown-*.zip

  linux-packages:
    name: Debian and RPM packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb cargo-generate-rpm --locked
      - run: cargo build --release --locked
      - run: cargo deb --no-build
      - run: cargo generate-rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm

  release:
    name: Publish the release
    needs: [build, linux-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect and checksum
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} release/ \;
          cd release && sha256sum * > checksums.txt
      - name: Take the notes from the changelog
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## / { if (found) exit; if (index($0, ver)) found = 1; next }
            found { print }
          ' CHANGELOG.md > notes.md
          echo "body<<NOTES_EOF" >> "$GITHUB_OUTPUT"
          cat notes.md >> "$GITHUB_OUTPUT"
          echo "NOTES_EOF" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: release/*
