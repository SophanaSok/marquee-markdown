name: Audit

# CI checks advisories on every push and pull request, but an advisory is
# published on its own schedule, not the project's. RUSTSEC-2026-0285 in rustls
# sat unnoticed until the 1.0.0 release happened to push. This asks the
# advisory database again twice a month whether or not anything changed here.
#
# Only advisories: licenses, bans and sources cannot change without a commit,
# and CI already checks those on the commit that changes them. A failure here
# is emailed to whoever last edited this schedule, as GitHub does for every
# scheduled workflow.
#
# GitHub disables schedules in a public repository after 60 days with no
# activity. If that happens, the Actions tab offers to re-enable it.

on:
  schedule:
    # The 1st and 15th of each month, 06:17 UTC. Cron cannot say "every other
    # week"; this is the nearest fixed spacing, and off the hour because the
    # top of the hour is when scheduled runs are most often delayed.
    - cron: '17 6 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --locked
      - run: cargo deny check advisories
