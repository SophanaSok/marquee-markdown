[package]
name = "marquee-markdown"
version = "0.9.0"
# Two binaries ship (`mmd` is the short alias), so `cargo run` needs telling
# which one is meant — without this, the documented
# `cargo run -- keys > docs/KEYBINDINGS.md` truncates the file and then fails.
default-run = "marquee-markdown"
edition = "2024"
rust-version = "1.88"
# Also the Debian synopsis and the RPM summary, so it keeps to the strictest
# rules any of those channels applies: under 80 characters, no leading
# article, no trailing full stop. The Homebrew formula's `desc` is the same
# string; `tests/docs.rs` holds them together.
description = "TUI markdown reader that renders documents like Claude artifacts"
license = "MIT"
authors = ["Sophana Sok <sokdevelopment@gmail.com>"]
repository = "https://github.com/SophanaSok/marquee-markdown"
homepage = "https://github.com/SophanaSok/marquee-markdown"
readme = "README.md"
keywords = ["markdown", "tui", "viewer", "terminal", "reader"]
categories = ["command-line-utilities", "text-processing"]
# The demo GIF is tracked for the README on GitHub and deliberately not
# shipped in the crate: it is a megabyte of animation that `cargo install` and
# docs.rs would download to never show anyone. Everything else under `docs/`
# stays — `tests/docs.rs` reads several of them, and a file excluded out from
# under a test compiles here and fails for whoever downloads it.
exclude = ["/.github", "/packaging", "/docs/demo.gif"]

[[bin]]
name = "marquee-markdown"
path = "src/main.rs"

# The short name, for something invoked constantly. Both are stubs over
# `cli::run`, so they cannot drift apart. Shipped as a second binary rather
# than a symlink so that every install method — cargo, deb, rpm, brew, scoop,
# a downloaded archive — produces the same thing.
[[bin]]
name = "mmd"
path = "src/bin/mmd.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
crossterm = "0.29.0"
dirs = "6.0.0"
ignore = "0.4.33"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
nucleo-matcher = "0.3.1"
open = "5.4.1"
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "charset", "http2", "gzip", "system-proxy"] }
# `--style system` asks the terminal about its own colors, which means a
# bounded read on /dev/tty: raw mode with a VTIME, so the wait costs one
# blocked read rather than a thread left holding the descriptor the reader is
# about to want. rustix is the safe way to say that — no `unsafe` here, and
# `#![forbid(unsafe_code)]` stays. It is already in the tree via crossterm and
# tempfile, so it costs one direct dependency and no new transitive ones.
rustix = { version = "1.1.4", features = ["termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.15.2"
# Exactly what is used and nothing else. `default-fancy` would additionally
# pull in plist and yaml loading, HTML output, dump *creation*, and syntect's
# own bundled syntaxes — the syntaxes come from two-face instead. Dropping them
# takes `plist` and `quick-xml` out of the tree entirely, along with their
# advisories, and takes several megabytes off the binary.
#
# `regex-fancy` rather than the default oniguruma: pure Rust, so no C toolchain
# and no MSVC on Windows.
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-themes",
    "regex-fancy",
] }
textwrap = "0.16.2"
toml = "1.1.4"
# Reading configuration is `toml`'s job; writing one setting back into a file
# somebody hand-wrote is this one's. The theme picker edits `[general] style`
# in place, and a reader who loses their comments to a theme change would be
# right to be annoyed. It shares `winnow` and `indexmap` with what is already
# here, so it costs one crate and no new transitive dependencies.
toml_edit = "0.25.13"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
pretty_assertions = "1.4.1"
proptest = "1.11.0"
tempfile = "3.27.0"

[lints.clippy]
bool_comparison = "warn"
redundant_closure = "warn"
collapsible_if = "warn"
needless_pass_by_value = "warn"
uninlined_format_args = "warn"
doc_markdown = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Receiving a signal, which is the one trigger with no race in it: a desktop's
# theme hook runs *after* it has retinted the terminals, so a hook that sends
# SIGUSR1 says "the colors are ready to be read" rather than "they are about to
# change". `#![forbid(unsafe_code)]` rules out installing a handler by hand —
# only a handful of functions are safe to call from one — and this crate is the
# established way to say it without: the handler it installs only writes to a
# self-pipe, and the thread reading that pipe is ordinary safe code.
# Unix-only because the signal is: Windows has nothing to map SIGUSR1 onto, and
# the other three triggers cover it there.
[target."cfg(unix)".dependencies]
signal-hook = "0.4.4"

# The man pages and completions under `dist/` are generated by the release
# workflow's packaging job before `cargo deb` / `cargo generate-rpm` run — the
# binary writes its own, so they cannot drift from the flags it accepts. A
# local `cargo deb` needs the same two commands first; `packaging/README.md`
# spells them out.
#
# No `LICENSE` in `usr/share/doc`: cargo-deb generates the `copyright` file
# there from `license-file`, and lintian's `extra-license-file` flags a second
# copy beside it.
[package.metadata.deb]
maintainer = "Sophana Sok <sokdevelopment@gmail.com>"
copyright = "2026, Sophana Sok <sokdevelopment@gmail.com>"
license-file = ["LICENSE", "4"]
extended-description = """\
marquee-markdown renders markdown in the terminal: styled headings, boxed
tables, syntax-highlighted code, GFM alerts, footnotes, and working OSC 8
hyperlinks, degrading to plain text when output is redirected.
.
Alongside the one-shot renderer there is a full-screen reader with a
scroll-tracking table of contents, in-document search, link navigation, live
reload on save, and rebindable keys, plus a fuzzy-filtered file browser. Ten
bundled themes; a style that follows the terminal's own colors as they
change. The short alias mmd invokes the same program."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/marquee-markdown", "usr/bin/", "755"],
    ["target/release/mmd", "usr/bin/", "755"],
    ["dist/man/marquee-markdown.1.gz", "usr/share/man/man1/", "644"],
    ["dist/man/mmd.1.gz", "usr/share/man/man1/", "644"],
    ["dist/completions/marquee-markdown.bash", "usr/share/bash-completion/completions/marquee-markdown", "644"],
    ["dist/completions/mmd.bash", "usr/share/bash-completion/completions/mmd", "644"],
    ["dist/completions/marquee-markdown.zsh", "usr/share/zsh/vendor-completions/_marquee-markdown", "644"],
    ["dist/completions/mmd.zsh", "usr/share/zsh/vendor-completions/_mmd", "644"],
    ["dist/completions/marquee-markdown.fish", "usr/share/fish/vendor_completions.d/marquee-markdown.fish", "644"],
    ["dist/completions/mmd.fish", "usr/share/fish/vendor_completions.d/mmd.fish", "644"],
    ["README.md", "usr/share/doc/marquee-markdown/", "644"],
]

# Self-hosted RPM for the release page, not a Fedora submission: the tool
# cannot mark `LICENSE` with `%license` or expand `%{?dist}` in `release`,
# both of which a Fedora review requires. `packaging/README.md` records that.
[package.metadata.generate-rpm]
license = "MIT"
summary = "TUI markdown reader that renders documents like Claude artifacts"
release = "1"
assets = [
    { source = "target/release/marquee-markdown", dest = "/usr/bin/marquee-markdown", mode = "755" },
    { source = "target/release/mmd", dest = "/usr/bin/mmd", mode = "755" },
    { source = "dist/man/marquee-markdown.1.gz", dest = "/usr/share/man/man1/marquee-markdown.1.gz", mode = "644" },
    { source = "dist/man/mmd.1.gz", dest = "/usr/share/man/man1/mmd.1.gz", mode = "644" },
    { source = "dist/completions/marquee-markdown.bash", dest = "/usr/share/bash-completion/completions/marquee-markdown", mode = "644" },
    { source = "dist/completions/mmd.bash", dest = "/usr/share/bash-completion/completions/mmd", mode = "644" },
    { source = "dist/completions/marquee-markdown.zsh", dest = "/usr/share/zsh/site-functions/_marquee-markdown", mode = "644" },
    { source = "dist/completions/mmd.zsh", dest = "/usr/share/zsh/site-functions/_mmd", mode = "644" },
    { source = "dist/completions/marquee-markdown.fish", dest = "/usr/share/fish/vendor_completions.d/marquee-markdown.fish", mode = "644" },
    { source = "dist/completions/mmd.fish", dest = "/usr/share/fish/vendor_completions.d/mmd.fish", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/marquee-markdown/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/marquee-markdown/LICENSE", mode = "644" },
]

# `cargo binstall marquee-markdown` fetches the prebuilt release archive
# instead of compiling. The archives are named with short platform names
# rather than target triples, so each supported triple is spelled out here;
# any other target falls back to building from source.
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-x86_64-linux.tar.gz"
bin-dir = "{ name }-v{ version }-x86_64-linux/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-aarch64-macos.tar.gz"
bin-dir = "{ name }-v{ version }-aarch64-macos/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-x86_64-macos.tar.gz"
bin-dir = "{ name }-v{ version }-x86_64-macos/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-x86_64-windows.zip"
bin-dir = "{ name }-v{ version }-x86_64-windows/{ bin }{ binary-ext }"
pkg-fmt = "zip"
