# Effective configuration. No file was found.

[general]
style = "auto"
# width = 80    # unset: taken from the terminal
line-numbers = false
mouse = false
all = false
preserve-new-lines = false

[ui]
contents = true

[keys.document]
"j" = "line-down"
"down" = "line-down"
"k" = "line-up"
"up" = "line-up"
"d" = "half-page-down"
"ctrl+d" = "half-page-down"
"u" = "half-page-up"
"ctrl+u" = "half-page-up"
"f" = "page-down"
"space" = "page-down"
"pgdn" = "page-down"
"b" = "page-up"
"pgup" = "page-up"
"g" = "top"
"home" = "top"
"G" = "bottom"
"end" = "bottom"
"h" = "scroll-left"
"left" = "scroll-left"
"l" = "scroll-right"
"right" = "scroll-right"
"/" = "search-start"
"n" = "search-next"
"N" = "search-previous"
"]" = "link-next"
"[" = "link-previous"
"enter" = "link-open"
"y" = "link-copy"
"c" = "copy-document"
"e" = "edit"
"r" = "reload"
"t" = "toggle-toc"
"tab" = "focus-next"
"T" = "toggle-theme"
"?" = "toggle-help"
"esc" = "escape"
"q" = "quit"
"ctrl+c" = "quit"
"ctrl+z" = "suspend"

[keys.browser]
"j" = "browser-down"
"down" = "browser-down"
"k" = "browser-up"
"up" = "browser-up"
"l" = "browser-page-down"
"right" = "browser-page-down"
"pgdn" = "browser-page-down"
"f" = "browser-page-down"
"d" = "browser-page-down"
"h" = "browser-page-up"
"left" = "browser-page-up"
"pgup" = "browser-page-up"
"b" = "browser-page-up"
"u" = "browser-page-up"
"g" = "browser-top"
"home" = "browser-top"
"G" = "browser-bottom"
"end" = "browser-bottom"
"enter" = "browser-open"
"/" = "filter-start"
"T" = "toggle-theme"
"?" = "toggle-help"
"esc" = "escape"
"q" = "quit"
"ctrl+c" = "quit"

[keys.toc]
"j" = "toc-down"
"down" = "toc-down"
"k" = "toc-up"
"up" = "toc-up"
"g" = "toc-top"
"home" = "toc-top"
"G" = "toc-bottom"
"end" = "toc-bottom"
"h" = "toc-collapse"
"left" = "toc-collapse"
"l" = "toc-expand"
"right" = "toc-expand"
"enter" = "toc-open"
"tab" = "focus-next"
"t" = "toggle-toc"
"/" = "search-start"
"T" = "toggle-theme"
"?" = "toggle-help"
"esc" = "escape"
"q" = "quit"
"ctrl+c" = "quit"

[keys.prompt]
"enter" = "prompt-accept"
"backspace" = "prompt-backspace"
"ctrl+u" = "prompt-clear"
"esc" = "escape"
"ctrl+c" = "quit"

[keys.help]
"?" = "toggle-help"
"esc" = "escape"
"q" = "escape"
"ctrl+c" = "quit"
