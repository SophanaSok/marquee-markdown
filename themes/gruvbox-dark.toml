# Gruvbox Dark — https://github.com/morhetz/gruvbox
name = "gruvbox-dark"
appearance = "dark"
syntax = "base16-eighties.dark"

[palette]
bg = "#282828"            # bg0
surface = "#1d2021"       # bg0_h, hard
fg = "#ebdbb2"            # fg1
muted = "#928374"         # gray
accent = "#fe8019"        # bright orange
accent_soft = "#d3869b"   # bright purple
border = "#3c3836"        # bg1

[palette.alerts]
note = "#83a598"          # bright blue
tip = "#b8bb26"           # bright green
important = "#d3869b"     # bright purple
warning = "#fabd2f"       # bright yellow
caution = "#fb4934"       # bright red
