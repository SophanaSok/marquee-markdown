# cargo-deny configuration.
#
# The licence list is the permissive set the Rust ecosystem actually uses. A
# new dependency carrying something not listed here fails CI on purpose: that
# is a decision to make deliberately, not one to discover after a release.

[advisories]
version = 2
ignore = [
    # bincode 1.x is unmaintained, and reaches us only through syntect, which
    # uses it to load its bundled theme dumps. There is no newer syntect that
    # drops it, and no version of this crate's own code that avoids it while
    # still highlighting anything. Revisit when syntect moves.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x via syntect; no upgrade path" },
]

[bans]
multiple-versions = "allow"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "OpenSSL",
    # webpki-root-certs: a bundle of certificates rather than code, published
    # under a data licence.
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
