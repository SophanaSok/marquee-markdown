# cargo-deny configuration.
#
# The licence list is the permissive set the Rust ecosystem actually uses. A
# new dependency carrying something not listed here fails CI on purpose: that
# is a decision to make deliberately, not one to discover after a release.

[advisories]
version = 2

[bans]
multiple-versions = "allow"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "OpenSSL",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
